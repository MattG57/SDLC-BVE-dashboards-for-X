<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI Coding — Efficiency (v4)</title>
<link rel="stylesheet" href="https://unpkg.com/@primer/css@21.3.1/dist/primer.css">
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/modules/accessibility.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background: var(--bgColor-default); margin: 0; }

  .v3-page { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }
  .v3-layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
  @media (max-width: 1100px) { .v3-layout { grid-template-columns: 1fr; } }
  .main-col { min-width: 0; }
  .side-panel { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }

  .sp-section { margin-bottom: 16px; }
  .sp-section:last-child { margin-bottom: 0; }
  .sp-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fgColor-muted); font-weight: 600; margin: 0 0 8px; }
  .sp-radio { display: flex; flex-direction: column; gap: 4px; }
  .sp-radio label { font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.1s; }
  .sp-radio label:hover { background: var(--bgColor-muted); }
  .sp-radio label.active { background: rgba(88,166,255,0.08); color: #58a6ff; font-weight: 600; }
  .sp-input { display: flex; flex-direction: column; gap: 6px; }
  .sp-input label { font-size: 11px; color: var(--fgColor-muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sp-input input { width: 88px; text-align: right; background: var(--bgColor-muted); border: 1px solid var(--borderColor-default); border-radius: 4px; color: var(--fgColor-default); padding: 2px 6px; font-size: 12px; }
  .sp-formula { font-size: 10px; font-family: monospace; color: var(--fgColor-muted); background: var(--bgColor-muted); padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
  .sp-compare { width: 100%; border-collapse: collapse; font-size: 11px; }
  .sp-compare th { text-align: right; color: var(--fgColor-muted); font-weight: 500; padding: 3px 0; }
  .sp-compare th:first-child { text-align: left; }
  .sp-compare td { padding: 3px 0; text-align: right; }
  .sp-compare td:first-child { text-align: left; }
  .sp-compare tr.active { color: #58a6ff; font-weight: 600; }
  .sp-divider { border: none; border-top: 1px solid var(--borderColor-muted); margin: 12px 0; }

  .hero-strip { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; margin-bottom: 20px; }
  .hero-card { text-align: center; padding: 16px 20px; border-radius: 8px; border: 1px solid var(--borderColor-default); }
  .hero-card.primary { border-top: 3px solid #58a6ff; flex: 0 0 220px; }
  .hero-card .hero-value { font-size: 2.5rem; font-weight: 700; line-height: 1.1; }
  .hero-card .hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fgColor-muted); margin-bottom: 4px; }
  .hero-card .hero-sub { font-size: 11px; color: var(--fgColor-muted); margin-top: 4px; }
  .hero-card .hero-method { font-size: 9px; color: var(--fgColor-muted); font-style: italic; margin-top: 2px; }
  .supporting-kpis { flex: 1 1 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .sup-card { text-align: center; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--borderColor-default); }
  .sup-card .sup-value { font-size: 1.4rem; font-weight: 600; }
  .sup-card .sup-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--fgColor-muted); }
  .sup-card .sup-sub { font-size: 10px; color: var(--fgColor-muted); }
  .user-inline { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(247,129,102,0.3); }
  .user-inline .ui-val { font-size: 1rem; font-weight: 600; color: #f78166; }
  .user-inline .ui-label { font-size: 9px; color: #f78166; opacity: 0.8; }
  .user-inline .ui-delta { font-size: 9px; }
  .hero-card .user-inline { margin-top: 6px; padding-top: 6px; }
  .hero-card .user-inline .ui-val { font-size: 1.3rem; }

  .section { margin-bottom: 44px; }
  .section-head { font-size: 22px; font-weight: 600; color: #58a6ff; margin: 0 0 6px; }
  .section-desc { font-size: 14px; color: var(--fgColor-muted); margin: 0 0 16px; }

  .chart-box { min-height: 300px; }
  .chart-sm { min-height: 220px; }
  .highcharts-background { fill: transparent !important; }

  .drivers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .drivers-grid { grid-template-columns: 1fr; } }
  .driver-toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .driver-toggles label { font-size: 11px; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .view-toggle { display: inline-flex; border: 1px solid var(--borderColor-default); border-radius: 6px; overflow: hidden; }
  .view-toggle button { padding: 2px 10px; font-size: 11px; border: none; cursor: pointer; background: var(--bgColor-muted); color: var(--fgColor-muted); }
  .view-toggle button + button { border-left: 1px solid var(--borderColor-default); }
  .view-toggle button.active { background: var(--bgColor-accent-muted); color: var(--fgColor-accent); font-weight: 600; }

  .dev-search { position: relative; }
  .dev-search input { width: 100%; }
  .dev-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; max-height: 200px; overflow: auto; }

  .loaded-banner {
    margin-bottom: 22px;
    padding: 14px 18px;
    border: 1px solid rgba(63,185,80,0.45);
    border-radius: 8px;
    background: rgba(35,134,54,0.16);
    color: #e6edf3;
    font-size: 13px;
  }
  .framing-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 16px;
    align-items: stretch;
  }
  @media (max-width: 1100px) { .framing-row { grid-template-columns: 1fr; } }
  .framing-card {
    border-top: 3px solid rgba(88,166,255,0.8);
  }
  .framing-label {
    font-size: 11px;
    color: #6e7681;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .framing-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--fgColor-default);
  }
  .framing-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--fgColor-muted);
    margin-top: 14px;
    white-space: pre-line;
  }
  .framing-flap {
    margin-bottom: 16px;
  }
  .framing-flap-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--borderColor-default);
    border-radius: 8px;
    background: var(--bgColor-muted);
    color: #58a6ff;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
  }
  .framing-flap-btn:hover {
    background: var(--bgColor-accent-muted);
  }
  .framing-flap-chevron {
    color: #58a6ff;
    font-size: 16px;
    line-height: 1;
  }
  .framing-flap-body {
    padding-top: 12px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

Highcharts.setOptions({
  chart: { backgroundColor: 'transparent', style: { fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' } },
  colors: ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#bc8cff', '#f778ba', '#79c0ff', '#56d364'],
  title: { style: { color: '#e6edf3', fontSize: '13px', fontWeight: '600' } },
  subtitle: { style: { color: '#8b949e', fontSize: '11px' } },
  xAxis: { labels: { style: { color: '#8b949e' } }, gridLineColor: '#30363d', lineColor: '#30363d', tickColor: '#30363d' },
  yAxis: { labels: { style: { color: '#8b949e' } }, gridLineColor: '#30363d', title: { style: { color: '#8b949e' } } },
  legend: { itemStyle: { color: '#e6edf3', fontSize: '11px' }, itemHoverStyle: { color: '#58a6ff' } },
  tooltip: { backgroundColor: '#161b22', borderColor: '#30363d', style: { color: '#e6edf3' } },
  plotOptions: { series: { animation: { duration: 300 } } },
  credits: { enabled: false },
});

async function loadData() {
  const bases = ['../../dataflow/data/', '../dataflow/data/'];
  let eff = null, sess = null, sessionLogs = null, cfg = null;
  for (const base of bases) {
    try {
      const r = await fetch(base + 'pipeline-manifest.json');
      if (!r.ok) continue;
      const manifest = await r.json();
      const effFile = (manifest.artifacts || []).find(f => f.startsWith('agentic-efficiency-days'));
      const sessFile = (manifest.artifacts || []).find(f => f.startsWith('agentic-pr-sessions'));
      const slFile = (manifest.artifacts || []).find(f => f.startsWith('agent-session-logs'));
      if (!effFile) continue;
      const artBase = base + 'materialized/';
      eff = await fetch(artBase + effFile).then(x => x.ok ? x.json() : null);
      sess = sessFile ? await fetch(artBase + sessFile).then(x => x.ok ? x.json() : null) : null;
      sessionLogs = slFile ? await fetch(artBase + slFile).then(x => x.ok ? x.json() : null) : null;
      if (eff) break;
    } catch (e) {}
  }
  for (const p of ['./data/config.json', '../data/config.json', '../../data/config.json']) {
    try {
      const r = await fetch(p, { cache: 'no-store' });
      if (r.ok) { cfg = await r.json(); break; }
    } catch (e) {}
  }
  return { efficiency: eff, sessions: sess, sessionLogs, config: cfg };
}

async function loadFramingSource() {
  const sourcePath = '../../data/agentic-ai-coding.json';
  try {
    const response = await fetch(sourcePath);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return await response.json();
  } catch (error) {
    throw new Error('Failed to load framing source: ' + sourcePath + ' (' + error.message + ')');
  }
}

function safeDiv(a, b) { return b > 0 ? a / b : null; }

function renderTemplate(text, replacements) {
  let output = text;
  Object.entries(replacements || {}).forEach(([key, value]) => {
    output = output.split('{' + key + '}').join(value == null ? '—' : String(value));
  });
  return output;
}

const DEFAULT_CONFIG = {
  // Fallback values — overridden by data/config.json (from dashboard-config.json) at runtime.
  // If config.json is missing, these fallbacks are used and a warning is shown.
  cfg_total_developers: 1100,
  cfg_pct_time_coding: 0.25,
  cfg_baseline_hours_per_dev_per_week: 40,
  cfg_workdays_per_week: 5,
  cfg_labor_cost_per_hour: 100,
  est_duration_factor: 0.20,
  est_hrs_per_kloc: 4,
};

const ESTIMATION_METHODS = [
  {
    key: 'duration',
    label: 'Duration-Based (Merged)',
    desc: (c) => `${c.est_duration_factor || 0.20}× duration factor applied to all agent session minutes`,
    formula: (c) => `hrs = (agent_session_minutes ÷ 60) × ${c.est_duration_factor || 0.20}`,
    calc: (d, c) => ((d.agent_session_minutes || 0) / 60) * (c.est_duration_factor || 0.20),
  },
  {
    key: 'loc',
    label: 'LoC-Based (Merged)',
    desc: (c) => `${c.est_hrs_per_kloc || 4} hrs saved per 1K merged LoC added`,
    formula: (c) => `hrs = (merged_loc_added ÷ 1000) × ${c.est_hrs_per_kloc || 4}`,
    calc: (d, c) => ((d.merged_loc_added || 0) / 1000) * (c.est_hrs_per_kloc || 4),
  },
  {
    key: 'dev-time',
    label: 'Dev Time Model',
    desc: () => 'Modeled dev time: prompt + compute + intervention + review (merged PRs only)',
    formula: () => 'hrs = (files×prompt_rate + active_mins + interventions×15 + files×review_rate×merged) ÷ 60',
    calc: (d) => ((d.dev_time_estimate_total || 0) / 60),
  },
];

const DRIVER_SERIES = [
  { key: 'sessions_started', perDev: 'sessions_per_dev', label: 'Sessions', color: '#58a6ff' },
  { key: 'agent_prs_created', perDev: 'prs_created_per_dev', label: 'PRs Created', color: '#3fb950' },
  { key: 'agent_prs_merged', perDev: 'prs_merged_per_dev', label: 'PRs Merged', color: '#d29922' },
  { key: 'agent_loc_added', perDev: 'loc_added_per_dev', label: 'LoC Added / 100', color: '#bc8cff', scale: 100 },
  { key: 'agent_session_minutes', perDev: 'session_mins_per_dev', label: 'Session Mins', color: '#f778ba' },
  { key: 'active_minutes_total', perDev: null, label: 'Active Mins (Compute)', color: '#e3b341' },
  { key: 'total_agent_requests', perDev: 'requests_per_dev', label: 'Requests', color: '#79c0ff' },
];

function hydrateMergedFields(dayRows, sessionRows) {
  if (!dayRows.length) return dayRows;
  const needsMergedFields = dayRows[0].merged_session_minutes == null && dayRows[0].merged_loc_added == null;
  if (!needsMergedFields || !sessionRows || !sessionRows.length) return dayRows;
  const mergedByDay = {};
  sessionRows.forEach(pr => {
    if (!pr.merged || !pr.day) return;
    if (!mergedByDay[pr.day]) mergedByDay[pr.day] = { mins: 0, loc: 0 };
    mergedByDay[pr.day].mins += (pr.duration_minutes || 0);
    mergedByDay[pr.day].loc += (pr.additions || 0);
  });
  return dayRows.map(d => ({
    ...d,
    merged_session_minutes: d.merged_session_minutes ?? (mergedByDay[d.day]?.mins || 0),
    merged_loc_added: d.merged_loc_added ?? (mergedByDay[d.day]?.loc || 0),
  }));
}

function computeSessionDevTime(session) {
  const files = session.changed_files || 0;
  const mixed = (session.additions || 0) > 0 && (session.deletions || 0) > 0;
  const promptRate = mixed ? 3 : 1;
  const reviewRate = mixed ? 15 : 5;
  const timeToPrompt = files * promptRate;
  const compute = session.active_minutes || 0;
  const timeToIntervene = (session.developer_interventions || 0) * 15;
  const merged = Boolean(session.pr_merged_at);
  const timeToReview = merged ? files * reviewRate : 0;
  return timeToPrompt + compute + timeToIntervene + timeToReview;
}

function hydrateSessionLogs(dayRows, sessionLogsData) {
  if (!sessionLogsData || !sessionLogsData.length) return dayRows;
  const byDay = {};
  sessionLogsData.forEach(s => {
    const day = (s.pr_created_at || '').slice(0, 10);
    if (!day) return;
    if (!byDay[day]) byDay[day] = { active_minutes: 0, dev_time_estimate: 0 };
    byDay[day].active_minutes += (s.active_minutes || 0);
    byDay[day].dev_time_estimate += computeSessionDevTime(s);
  });
  return dayRows.map(d => ({
    ...d,
    active_minutes_total: d.active_minutes_total ?? (byDay[d.day]?.active_minutes || 0),
    dev_time_estimate_total: d.dev_time_estimate_total ?? (byDay[d.day]?.dev_time_estimate || 0),
  }));
}

function computeAll(days, config) {
  return days.map(d => {
    const active = d.active_devs || 0;
    const est = {};
    ESTIMATION_METHODS.forEach(m => {
      const hrs = m.calc(d, config);
      est['est_' + m.key + '_hrs'] = hrs;
      est['est_' + m.key + '_per_dev'] = safeDiv(hrs, active);
    });
    return { ...d, ...est };
  });
}

var fmt = n => n == null ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
var fmtDec = (n, d) => n == null ? '—' : Number(n).toLocaleString(undefined, { minimumFractionDigits: d || 1, maximumFractionDigits: d || 1 });
var fmtPct = n => n == null ? '—' : (n * 100).toFixed(1) + '%';
var fmtCurrency = n => n == null ? '—' : '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
var fmtCompact = n => { if (n == null) return '—'; if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + 'K'; return fmt(n); };

function Chart({ options, className }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) {
      chartRef.current.update(options, true, true);
    } else {
      chartRef.current = Highcharts.chart(ref.current, options);
    }
    return () => {};
  }, [JSON.stringify(options)]);
  useEffect(() => () => {
    if (chartRef.current) {
      chartRef.current.destroy();
      chartRef.current = null;
    }
  }, []);
  return <div ref={ref} className={className || 'chart-box'} />;
}

function FramingCard({ label, title, text }) {
  return (
    <div className="Box p-3 framing-card">
      {label ? <div className="framing-label">{label}</div> : null}
      <div className="framing-title">{title}</div>
      <div className="framing-text">{text}</div>
    </div>
  );
}

function FramingFlap({ label, meta, children, defaultOpen = false }) {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  return (
    <div className="framing-flap">
      <button type="button" className="framing-flap-btn" onClick={() => setIsOpen(!isOpen)} aria-expanded={isOpen}>
        <span>{label}</span>
        <span className="framing-flap-chevron">{isOpen ? '▾' : '▸'}</span>
      </button>
      {isOpen ? <div className="framing-flap-body">{children}</div> : null}
    </div>
  );
}

function SidePanel({ config, setConfig, method, setMethod, days, users, selectedUser, setSelectedUser, configSource }) {
  const methodDef = ESTIMATION_METHODS.find(m => m.key === method) || ESTIMATION_METHODS[0];
  const comparison = ESTIMATION_METHODS.map(m => {
    const field = 'est_' + m.key + '_per_dev';
    const vals = days.map(d => d[field]).filter(v => v != null);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const total = days.reduce((s, d) => s + (d['est_' + m.key + '_hrs'] || 0), 0);
    return { key: m.key, label: m.label, avg, total };
  });

  function updateCfg(key, val) {
    setConfig(prev => ({ ...prev, [key]: val }));
  }

  const logins = useMemo(() => [...new Set((users || []).map(u => u.developer))].sort(), [users]);
  const [devQuery, setDevQuery] = useState('');
  const [devOpen, setDevOpen] = useState(false);
  const filtered = devQuery ? logins.filter(l => l.toLowerCase().includes(devQuery.toLowerCase())).slice(0, 8) : logins.slice(0, 8);

  return (
    <div className="side-panel">
      <div className="Box p-3">
        <div className="sp-section">
          <div className="sp-title">Estimation Method</div>
          <div className="sp-radio">
            {ESTIMATION_METHODS.map(m => {
              const active = m.key === method;
              return <label key={m.key} className={active ? 'active' : ''}>
                <input type="radio" name="method" checked={active} onChange={() => setMethod(m.key)} style={{ accentColor: '#58a6ff' }} />
                {m.label}
              </label>;
            })}
          </div>
          <div className="sp-formula">{methodDef.formula(config)}</div>
        </div>

        <hr className="sp-divider" />

        <div className="sp-section">
          <div className="sp-title">Assumptions</div>
          <div className="sp-input">
            <label>Duration multiplier <input type="number" value={config.est_duration_factor ?? 0.20} min="0" step="0.1" onChange={e => updateCfg('est_duration_factor', parseFloat(e.target.value) || 0)} /></label>
            <label>Hrs / 1K merged LoC <input type="number" value={config.est_hrs_per_kloc ?? 4} min="0" step="0.5" onChange={e => updateCfg('est_hrs_per_kloc', parseFloat(e.target.value) || 0)} /></label>
          </div>
        </div>

        <hr className="sp-divider" />

        <div className="sp-section">
          <div className="sp-title">Organization</div>
          <div className="sp-input">
            <label>Total developers <input type="number" value={config.cfg_total_developers ?? ''} min="0" step="1" onChange={e => updateCfg('cfg_total_developers', parseFloat(e.target.value) || null)} /></label>
            <label>% time coding <input type="number" value={config.cfg_pct_time_coding ?? 0.25} min="0" max="1" step="0.05" onChange={e => updateCfg('cfg_pct_time_coding', parseFloat(e.target.value) || 0.25)} /></label>
            <label>Labor cost $/hr <input type="number" value={config.cfg_labor_cost_per_hour ?? ''} min="0" step="1" onChange={e => updateCfg('cfg_labor_cost_per_hour', e.target.value ? parseFloat(e.target.value) : null)} /></label>
            <label>Workdays / week <input type="number" value={config.cfg_workdays_per_week ?? 5} min="1" max="7" step="1" onChange={e => updateCfg('cfg_workdays_per_week', parseFloat(e.target.value) || 5)} /></label>
            <label>Baseline hrs / week <input type="number" value={config.cfg_baseline_hours_per_dev_per_week ?? 40} min="1" step="1" onChange={e => updateCfg('cfg_baseline_hours_per_dev_per_week', parseFloat(e.target.value) || 40)} /></label>
          </div>
        </div>

        <hr className="sp-divider" />

        <div className="sp-section">
          <div className="sp-title">Method Comparison</div>
          <table className="sp-compare">
            <thead><tr><th>Method</th><th>Hrs/Dev/Day</th><th>Total</th></tr></thead>
            <tbody>
              {comparison.map(m => <tr key={m.key} className={m.key === method ? 'active' : ''}>
                <td>{m.label}</td>
                <td>{fmtDec(m.avg, 2)}</td>
                <td>{fmtCompact(m.total)}</td>
              </tr>)}
            </tbody>
          </table>
        </div>

        <hr className="sp-divider" />

        <div className="sp-section">
          <div className="sp-title">Developer Overlay</div>
          {selectedUser ? (
            <div className="d-flex flex-items-center" style={{ gap: '6px' }}>
              <span style={{ fontSize: '12px', color: '#58a6ff', fontWeight: 600 }}>{selectedUser}</span>
              <button style={{ background: 'none', border: 'none', color: 'var(--fgColor-muted)', cursor: 'pointer', fontSize: '12px' }} onClick={() => setSelectedUser(null)}>✕</button>
              <span style={{ fontSize: '10px', color: 'var(--fgColor-muted)', marginLeft: 'auto' }}>dashed on charts</span>
            </div>
          ) : (
            <div className="dev-search">
              <input type="text" className="form-control input-sm" placeholder="Search login…" value={devQuery}
                onChange={e => { setDevQuery(e.target.value); setDevOpen(true); }}
                onFocus={() => setDevOpen(true)} onBlur={() => setTimeout(() => setDevOpen(false), 150)} />
              {devOpen && filtered.length > 0 && (
                <div className="Box dev-dropdown color-shadow-large">
                  {filtered.map(l => <div key={l} className="Box-row px-3 py-1 f6" style={{ cursor: 'pointer' }} onMouseDown={() => { setSelectedUser(l); setDevQuery(''); setDevOpen(false); }}>{l}</div>)}
                </div>
              )}
            </div>
          )}
        </div>

        <hr className="sp-divider" />

        <div className="sp-section">
          <div className="d-flex flex-items-center flex-justify-between">
            <div className="sp-title" style={{ margin: 0 }}>Config</div>
            {configSource && <span style={{ fontSize: '9px', padding: '1px 5px', borderRadius: '3px', background: 'rgba(63,185,80,0.15)', color: '#3fb950' }}>from repo</span>}
          </div>
          <button style={{ fontSize: '10px', color: 'var(--fgColor-muted)', background: 'none', border: 'none', cursor: 'pointer', marginTop: '4px', textDecoration: 'underline' }}
            onClick={() => {
              const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'dashboard-config.json';
              a.click();
            }}>💾 Export config</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [loaded, setLoaded] = useState(null);
  const [framing, setFraming] = useState(null);
  const [config, setConfig] = useState({ ...DEFAULT_CONFIG });
  const [configSource, setConfigSource] = useState(false);
  const [method, setMethod] = useState('duration');
  const [selectedUser, setSelectedUser] = useState(null);
  const [viewMode, setViewMode] = useState('combined');
  const [toggles, setToggles] = useState(() => {
    const t = {};
    DRIVER_SERIES.forEach(s => { t[s.key] = true; });
    return t;
  });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lookback, setLookback] = useState(28);

  useEffect(() => {
    Promise.all([loadData(), loadFramingSource()]).then(([result, framingSource]) => {
      const mergedConfig = { ...DEFAULT_CONFIG, ...(result.config || {}) };
      setConfig(mergedConfig);
      setConfigSource(result.config || null);

      const eff = result.efficiency;
      if (!eff || !eff.data || !eff.data.length) {
        setError('Materialized agentic artifact not found or empty.');
        setLoading(false);
        return;
      }

      const sessionRows = result.sessions?.data || [];
      const sessionLogRows = result.sessionLogs?.session_logs || [];
      const baseDays = hydrateSessionLogs(
        hydrateMergedFields(
          [...eff.data].sort((a, b) => (a.day || '').localeCompare(b.day || '')),
          sessionRows
        ),
        sessionLogRows
      );
      setLoaded({
        ...result,
        baseDays,
        days: computeAll(baseDays, mergedConfig),
        devDays: eff._devDays || [],
      });
      setFraming(framingSource);
      setLoading(false);
    }).catch(e => {
      console.error('Artifact load error:', e);
      setError('Failed to load artifact: ' + e.message);
      setLoading(false);
    });
  }, []);

  if (loading) {
    return (
      <div className="v3-page">
        <div className="Box p-4 text-center color-fg-muted">
          <p className="f3 mb-2">⏳</p>
          <p className="f5">Loading materialized artifacts…</p>
        </div>
      </div>
    );
  }

  if (error || !loaded) {
    return (
      <div className="v3-page">
        <div className="flash flash-warn f5 mb-3">
          ⚠️ {error || 'Dashboard data not available.'}
          <p className="f6 mt-2 color-fg-muted">Run the pipeline: <code>./scripts/collect-and-materialize.sh</code></p>
        </div>
      </div>
    );
  }
  if (!framing?.views?.efficiency?.cards) return null;

  // ── Config fallback detection ──
  const configFallbacks = configSource
    ? Object.keys(DEFAULT_CONFIG).filter(k => !(k in (typeof configSource === 'object' ? configSource : {})))
    : Object.keys(DEFAULT_CONFIG);
  const usingFallback = !configSource || configFallbacks.length > 0;

  const allBaseDays = loaded.baseDays;
  const filteredBase = lookback != null ? allBaseDays.slice(-lookback) : allBaseDays;
  const days = computeAll(filteredBase, config);
  const users = loaded.devDays;
  const sessions = loaded.sessions?.data || [];
  const effProfile = loaded.efficiency?.artifact?.profile || {};
  const sessionProfile = loaded.sessions?.artifact?.profile || {};
  const methodDef = ESTIMATION_METHODS.find(m => m.key === method) || ESTIMATION_METHODS[0];
  const framingCards = framing.views.efficiency.cards;
  const n = days.length;
  const dateRange = n > 0 ? days[0].day + ' → ' + days[n - 1].day : '';
  const totalDevs = config.cfg_total_developers || 0;
  const codingPct = config.cfg_pct_time_coding || 0.25;
  const baseHrsPerDay = (config.cfg_baseline_hours_per_dev_per_week || 40) / (config.cfg_workdays_per_week || 5);
  const totalCapacity = totalDevs * codingPct * baseHrsPerDay * n;
  const totalSessionHours = days.reduce((s, d) => s + ((d.active_minutes_total || d.agent_session_minutes || 0) / 60), 0);
  const totalHrs = days.reduce((s, d) => s + (d['est_' + method + '_hrs'] || 0), 0);
  const avgPerDev = (() => {
    const vals = days.map(d => d['est_' + method + '_per_dev']).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  })();
  const avgRequestsPerDev = (() => {
    const vals = days.map(d => d.requests_per_dev).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  })();
  const avgMergedOutputPerDev = (() => {
    const vals = days.map(d => d.prs_merged_per_dev).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  })();
  const avgActiveDevs = n > 0 ? Math.round(days.reduce((s, d) => s + (d.active_devs || 0), 0) / n) : 0;
  const pctOfCapacityCovered = safeDiv(totalSessionHours, totalCapacity);
  const pctSavedOfTotal = safeDiv(totalHrs, totalCapacity);
  const pctSavedOfCodingTime = avgPerDev != null && (baseHrsPerDay * codingPct) > 0 ? avgPerDev / (baseHrsPerDay * codingPct) : null;
  const orgHrsPerDay = safeDiv(totalHrs, n);
  const laborCost = config.cfg_labor_cost_per_hour != null ? totalHrs * config.cfg_labor_cost_per_hour : null;
  const laborCostPerDay = orgHrsPerDay != null && config.cfg_labor_cost_per_hour != null ? orgHrsPerDay * config.cfg_labor_cost_per_hour : null;

  const computedAt = loaded.efficiency?.artifact?.computed_at;
  const materializedAge = computedAt ? (() => {
    const h = (Date.now() - new Date(computedAt).getTime()) / 3600000;
    return h < 24 ? Math.max(0, Math.floor(h)) + 'h ago' : Math.floor(h / 24) + 'd ago';
  })() : null;

  const userDayMap = {};
  if (selectedUser) {
    users.filter(u => u.developer === selectedUser).forEach(u => { userDayMap[u.day] = u; });
  }
  const hasUser = Object.keys(userDayMap).length > 0;
  const userKPIs = hasUser ? (() => {
    const uDays = Object.values(userDayMap);
    const activeDays = uDays.length;
    const total = uDays.reduce((s, u) => s + (methodDef.calc({ agent_session_minutes: u.agent_session_minutes || 0, merged_loc_added: u.agent_loc_added || 0 }, config) || 0), 0);
    const avg = activeDays > 0 ? total / activeDays : null;
    const vsOrg = avgPerDev != null && avg != null ? avg - avgPerDev : null;
    const econValue = config.cfg_labor_cost_per_hour != null ? total * config.cfg_labor_cost_per_hour : null;
    return { activeDays, total, avg, vsOrg, econValue };
  })() : null;

  const xLabels = days.map(d => d.day);
  const tickInt = Math.max(1, Math.floor(n / 12));

  const totalDevHrs = totalDevs * baseHrsPerDay * n;
  const nonCodingHrs = totalDevHrs - totalCapacity;
  const hrsSavedForPie = totalHrs || 0;

  const capacityPieOpts = {
    chart: { type: 'pie', height: 280 },
    title: { text: 'Developer Hours in Period' },
    subtitle: { text: fmtCompact(totalDevHrs) + ' total hrs · ' + fmt(totalDevs) + ' devs × ' + n + ' days' },
    tooltip: { pointFormat: '<b>{point.y:,.0f} hrs</b> ({point.percentage:.1f}%)' },
    plotOptions: { pie: { borderWidth: 0, dataLabels: { enabled: true, format: '<b>{point.name}</b>: {point.percentage:.1f}%', style: { color: '#e6edf3', fontSize: '11px', textOutline: 'none' } } } },
    series: [{
      name: 'Hours',
      data: [
        { name: 'Est. hours spent', y: Math.round(hrsSavedForPie), color: '#58a6ff' },
        { name: 'Coding', y: Math.max(0, Math.round(totalCapacity - hrsSavedForPie)), color: '#58a6ff' },
        { name: 'Non-coding', y: Math.round(nonCodingHrs), color: '#30363d' },
      ],
    }],
  };

  const pctOfTotalOpts = {
    chart: { type: 'areaspline', height: 240 },
    title: { text: 'Hours Spent as % of Total Coding Capacity' },
    subtitle: { text: methodDef.desc(config) },
    xAxis: { categories: xLabels, labels: { rotation: -45, style: { fontSize: '9px' } }, tickInterval: tickInt },
    yAxis: { title: { text: null }, min: 0, labels: { format: '{value}%' } },
    tooltip: { shared: true, valueSuffix: '%', valueDecimals: 2 },
    legend: { enabled: false },
    series: [{
      name: '% of total capacity',
      data: days.map(d => {
        const dailyCodingCapacity = totalDevs * codingPct * baseHrsPerDay;
        const saved = d['est_' + method + '_hrs'] || 0;
        return dailyCodingCapacity > 0 ? Math.round((saved / dailyCodingCapacity) * 10000) / 100 : 0;
      }),
      color: '#3fb950',
      fillOpacity: 0.08,
      marker: { radius: 2 },
    }],
  };

  const perDevOpts = {
    chart: { type: 'areaspline', height: 240 },
    title: { text: 'Hours Spent per Active Developer per Day' },
    subtitle: { text: methodDef.desc(config) },
    xAxis: { categories: xLabels, labels: { rotation: -45, style: { fontSize: '9px' } }, tickInterval: tickInt },
    yAxis: { title: { text: null }, min: 0, labels: { format: '{value} hrs' } },
    tooltip: { shared: true, valueDecimals: 2, valueSuffix: ' hrs' },
    legend: { enabled: hasUser },
    series: [
      { name: 'Per active dev', data: days.map(d => d['est_' + method + '_per_dev']), color: '#58a6ff', fillOpacity: 0.06, marker: { radius: 2 } },
      ...(hasUser ? [{
        name: selectedUser,
        data: days.map(d => {
          const u = userDayMap[d.day];
          return u ? methodDef.calc({ agent_session_minutes: u.agent_session_minutes || 0, merged_loc_added: u.agent_loc_added || 0 }, config) : null;
        }),
        color: '#f78166',
        dashStyle: 'ShortDash',
        marker: { radius: 3, symbol: 'diamond' },
        lineWidth: 2,
        fillOpacity: 0,
      }] : []),
    ],
  };

  const enterpriseOpts = {
    chart: { type: 'column', height: 220 },
    title: { text: 'Enterprise-Wide Hours Spent per Day' },
    xAxis: { categories: xLabels, labels: { rotation: -45, style: { fontSize: '9px' } }, tickInterval: tickInt },
    yAxis: [
      { title: { text: null }, min: 0, labels: { format: '{value} hrs' } },
      { title: { text: null }, opposite: true, min: 0, labels: { format: '{value}' } },
    ],
    tooltip: { shared: true },
    plotOptions: { column: { borderRadius: 2, opacity: 0.8 } },
    legend: { enabled: true },
    series: [
      { name: 'Hours spent', type: 'column', data: days.map(d => Math.round(d['est_' + method + '_hrs'] || 0)), color: '#58a6ff', yAxis: 0 },
      { name: 'Active devs', type: 'spline', data: days.map(d => d.active_devs || 0), color: '#58a6ff', yAxis: 1, dashStyle: 'ShortDot', marker: { radius: 2 }, lineWidth: 1.5 },
    ],
  };

  const activeDrivers = DRIVER_SERIES.filter(s => toggles[s.key] && days.some(d => (d[s.key] || 0) > 0));

  function driverChartOpts(s) {
    const series = [{ name: s.label + ' / Dev', data: days.map(d => d[s.perDev] != null ? Math.round(d[s.perDev] * 100) / 100 : null), color: s.color }];
    if (hasUser) {
      series.push({
        name: selectedUser,
        data: days.map(d => {
          const u = userDayMap[d.day];
          return u ? Math.round((((u[s.key] || 0) / (s.scale || 1)) * 100)) / 100 : null;
        }),
        color: s.color,
        dashStyle: 'Dash',
        marker: { radius: 2, symbol: 'diamond' },
        lineWidth: 2,
      });
    }
    return {
      chart: { type: 'spline', height: 200 },
      title: { text: s.label },
      xAxis: { categories: xLabels, labels: { rotation: -45, style: { fontSize: '8px' } }, tickInterval: Math.max(1, Math.floor(n / 8)) },
      yAxis: { title: { text: null }, min: 0 },
      tooltip: { shared: true, valueDecimals: 2 },
      legend: { enabled: hasUser },
      series,
    };
  }

  function combinedTrendOpts() {
    const series = activeDrivers.map(s => ({
      name: s.label + ' / Dev',
      data: days.map(d => d[s.perDev] != null ? Math.round(d[s.perDev] * 100) / 100 : null),
      color: s.color,
    }));
    if (hasUser) {
      activeDrivers.forEach(s => {
        series.push({
          name: selectedUser + ' ' + s.label,
          data: days.map(d => {
            const u = userDayMap[d.day];
            return u ? Math.round((((u[s.key] || 0) / (s.scale || 1)) * 100)) / 100 : null;
          }),
          color: s.color,
          dashStyle: 'Dash',
          marker: { radius: 2, symbol: 'diamond' },
          lineWidth: 2,
        });
      });
    }
    return {
      chart: { type: 'spline', height: 300 },
      title: { text: 'Daily Trend — Per Active Agent User' },
      xAxis: { categories: xLabels, labels: { rotation: -45, style: { fontSize: '9px' } }, tickInterval: Math.max(1, Math.floor(n / 12)) },
      yAxis: { title: { text: 'Per Active Dev' }, min: 0 },
      tooltip: { shared: true, valueDecimals: 2 },
      series,
    };
  }

  function driverBarOpts() {
    const avgPerDevData = activeDrivers.map(s => {
      const vals = days.map(d => d[s.perDev]).filter(v => v != null);
      return vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10 : 0;
    });
    const barSeries = [{ name: 'Avg / Dev / Day', data: avgPerDevData.map((y, i) => ({ y, color: activeDrivers[i].color })) }];
    if (hasUser) {
      const userAvg = activeDrivers.map(s => {
        const userDays = days.map(d => userDayMap[d.day]).filter(Boolean);
        if (!userDays.length) return 0;
        const vals = userDays.map(u => (u[s.key] || 0) / (s.scale || 1));
        return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
      });
      barSeries.push({ name: selectedUser + ' Avg', data: userAvg.map((y, i) => ({ y, color: 'transparent', borderColor: activeDrivers[i].color, borderWidth: 2 })) });
    }
    const barH = Math.max(200, activeDrivers.length * (hasUser ? 55 : 40) + 80);
    return {
      chart: { type: 'bar', height: barH },
      title: { text: 'Daily Avg / Dev' + (hasUser ? ' vs ' + selectedUser : '') },
      xAxis: { categories: activeDrivers.map(s => s.label), labels: { style: { fontSize: '12px' } } },
      yAxis: { title: { text: 'Daily Avg' } },
      tooltip: { shared: true, valueSuffix: ' / day', valueDecimals: 1 },
      plotOptions: { bar: { borderRadius: 3, groupPadding: 0.15, dataLabels: { enabled: true, format: '{y:,.1f}', style: { color: '#e6edf3', textOutline: 'none', fontSize: '11px' } } } },
      legend: { enabled: hasUser },
      series: barSeries,
    };
  }

  const attempts = sessionProfile.record_count || sessions.length;
  const statusBreakdown = sessionProfile.status_breakdown || {};
  const completions = statusBreakdown.merged ?? sessions.filter(s => s.merged).length;
  const openSessions = statusBreakdown.open ?? sessions.filter(s => !s.merged && (s.state === 'open' || s.state === 'Open')).length;
  const closedNoMerge = statusBreakdown.closed_no_merge ?? sessions.filter(s => !s.merged && (s.state || '').toLowerCase() === 'closed').length;
  const otherSessions = statusBreakdown.other ?? Math.max(0, attempts - completions - openSessions - closedNoMerge);
  const yieldRate = safeDiv(completions, attempts);
  const uniqueDevs = effProfile.unique_people || new Set(users.map(u => u.developer)).size;
  const devDayCount = effProfile.detail_row_count || users.length;
  const loadedArtifacts = [
    'agentic-efficiency-days',
    ...(sessions.length ? ['agentic-pr-sessions'] : []),
    ...(loaded.sessionLogs?.session_logs?.length ? ['agent-session-logs'] : []),
  ].join(' + ');

  const dqComparison = ESTIMATION_METHODS.map(m => {
    const field = 'est_' + m.key + '_per_dev';
    const vals = days.map(d => d[field]).filter(v => v != null);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const total = days.reduce((s, d) => s + (d['est_' + m.key + '_hrs'] || 0), 0);
    return { key: m.key, label: m.label, avg, total, active: m.key === method };
  });

  return (
    <div className="v3-page">
      <div className="d-flex flex-items-center flex-justify-between mb-3 flex-wrap" style={{ gap: '8px' }}>
        <div>
          <h1 className="f1 color-fg-default" style={{ margin: 0 }}>
            Agentic AI Coding — Efficiency
            <span style={{ fontSize: '12px', marginLeft: '8px', padding: '2px 8px', borderRadius: '10px', background: 'rgba(88,166,255,0.15)', color: '#58a6ff', verticalAlign: 'middle' }}>v4</span>
          </h1>
          <p className="f6 color-fg-muted mt-1">{dateRange} · {n} days · {fmt(avgActiveDevs)} avg active devs{materializedAge ? ' · materialized ' + materializedAge : ''}</p>
        </div>
        <div style={{ display: 'flex', gap: '4px', alignItems: 'center' }}>
          {[14, 28, 60, 90, null].map(v => (
            <button key={String(v)} onClick={() => setLookback(v)}
              style={{ padding: '3px 10px', borderRadius: '20px', border: '1px solid', fontSize: '12px', cursor: 'pointer',
                background: lookback === v ? '#58a6ff' : 'transparent',
                color: lookback === v ? '#0d1117' : 'var(--fgColor-muted)',
                borderColor: lookback === v ? '#58a6ff' : 'var(--borderColor-default)' }}>
              {v == null ? 'All' : v + 'd'}
            </button>
          ))}
        </div>
      </div>

      <div className="v3-layout">
        <div className="main-col">
          {usingFallback && <div className="flash flash-warn mb-3" style={{fontSize:'12px',padding:'8px 12px'}}>
            ⚠️ {!configSource
              ? 'No config.json found — using built-in fallback values for all parameters. Deploy the pipeline or add data/config.json.'
              : `Config loaded but missing keys (using fallbacks): ${configFallbacks.join(', ')}`}
          </div>}
          <div className="loaded-banner">
            ✅ Loaded <strong>{loadedArtifacts}</strong> · {n} days ({dateRange}) · {fmt(uniqueDevs)} developers · {fmt(devDayCount)} dev-days · {fmt(attempts)} PR sessions
          </div>

          <FramingFlap label="Job Scope">
            <div className="framing-row">
              <FramingCard
                label={framingCards.jobToBeDone.kicker}
                title={framingCards.jobToBeDone.title}
                text={framingCards.jobToBeDone.body}
              />
              <FramingCard
                label={framingCards.whatCountsAsCompletion.kicker}
                title={framingCards.whatCountsAsCompletion.title}
                text={framingCards.whatCountsAsCompletion.body}
              />
              <FramingCard
                label={framingCards.jobClass.kicker}
                title={framingCards.jobClass.title}
                text={framingCards.jobClass.body}
              />
            </div>
          </FramingFlap>

          <FramingFlap label="Improvement Frame">
            <div className="framing-row">
              <FramingCard
                label={framingCards.howEfficiencyImproves.kicker}
                title={framingCards.howEfficiencyImproves.title}
                text={framingCards.howEfficiencyImproves.body}
              />
              <FramingCard
                label={framingCards.estimatesAndAssumptions.kicker}
                title={framingCards.estimatesAndAssumptions.title}
                text={framingCards.estimatesAndAssumptions.body}
              />
              <FramingCard
                label={framingCards.indicatorsOfProgress.kicker}
                title={framingCards.indicatorsOfProgress.title}
                text={framingCards.indicatorsOfProgress.body}
              />
            </div>
          </FramingFlap>

          <div className="section">
            <div className="section-head">How much developer time is engaged in agentic work?</div>
            <div className="section-desc">Total enterprise coding capacity: {fmt(totalDevs)} developers × {fmtPct(codingPct)} coding time × {baseHrsPerDay.toFixed(0)}h workday</div>
            <div className="hero-strip">
              <div className="hero-card primary">
                <div className="hero-label">Total Coding Capacity</div>
                <div className="hero-value" style={{ color: 'var(--fgColor-default)' }}>{fmtCompact(totalCapacity)}<span style={{ fontSize: '0.5em', opacity: 0.6 }}> hrs</span></div>
                <div className="hero-sub">{fmt(totalDevs)} devs × {n} days</div>
              </div>
              <div className="supporting-kpis">
                <div className="sup-card">
                  <div className="sup-label">Est. Hours Spent</div>
                  <div className="sup-value" style={{ color: '#58a6ff' }}>{fmtCompact(totalHrs)}</div>
                  <div className="sup-sub">{methodDef.label} method</div>
                </div>
                <div className="sup-card">
                  <div className="sup-label">% of Total</div>
                  <div className="sup-value" style={{ color: '#58a6ff' }}>{fmtPct(pctSavedOfTotal)}</div>
                  <div className="sup-sub">est. time spent ÷ total capacity</div>
                </div>
                <div className="sup-card">
                  <div className="sup-label">Agentic Active %</div>
                  <div className="sup-value" style={{ color: '#58a6ff' }}>{fmtPct(pctOfCapacityCovered)}</div>
                  <div className="sup-sub">{fmt(avgActiveDevs)} of {fmt(totalDevs)} devs · daily avg</div>
                </div>
                <div className="sup-card">
                  <div className="sup-label">Observed Agent Hrs</div>
                  <div className="sup-value">{fmtCompact(totalSessionHours)}</div>
                  <div className="sup-sub">compute minutes ÷ 60</div>
                </div>
              </div>
            </div>
            <div className="d-flex flex-wrap" style={{ gap: '16px' }}>
              <div className="Box p-3" style={{ flex: '1 1 300px' }}><Chart options={capacityPieOpts} /></div>
              <div className="Box p-3" style={{ flex: '2 1 480px' }}><Chart options={pctOfTotalOpts} /></div>
            </div>
          </div>

          <div className="section">
            <div className="section-head">Attempts and completions</div>
            <div className="section-desc">Agent PR sessions in the period — attempts are started sessions, completions are sessions that ended in a merged PR.</div>
            <div className="d-flex flex-wrap" style={{ gap: '12px' }}>
              <div className="sup-card" style={{ flex: '1 1 140px' }}>
                <div className="sup-label">Attempts</div>
                <div className="sup-value">{fmt(attempts)}</div>
                <div className="sup-sub">agent PR sessions</div>
              </div>
              <div className="sup-card" style={{ flex: '1 1 140px' }}>
                <div className="sup-label">Completions</div>
                <div className="sup-value">{fmt(completions)}</div>
                <div className="sup-sub">merged PR sessions</div>
              </div>
              <div className="sup-card" style={{ flex: '1 1 140px' }}>
                <div className="sup-label">Yield</div>
                <div className="sup-value" style={{ color: '#3fb950' }}>{fmtPct(yieldRate)}</div>
                <div className="sup-sub">completions ÷ attempts</div>
              </div>
            </div>
          </div>

          <div className="section">
            <div className="section-head">How is Agent usage increasing?</div>
            <div className="section-desc">Active agent users and time spent per developer over the selected period</div>
            <div className="hero-strip">
              <div className="hero-card primary">
                <div className="hero-label">Hrs Spent / Active User / Day</div>
                <div className="hero-value" style={{ color: '#58a6ff' }}>{fmtDec(avgPerDev, 2)}</div>
                <div className="hero-sub">{pctSavedOfCodingTime != null ? fmtPct(pctSavedOfCodingTime) + ' of coding time' : ''}</div>
                <div className="hero-method">{methodDef.label} method</div>
                {userKPIs && (
                  <div className="user-inline">
                    <div className="ui-val">{fmtDec(userKPIs.avg, 2)}</div>
                    <div className="ui-label">{selectedUser}</div>
                    <div className="ui-delta" style={{ color: userKPIs.vsOrg != null && userKPIs.vsOrg >= 0 ? '#3fb950' : '#f85149' }}>
                      {userKPIs.vsOrg != null ? (userKPIs.vsOrg >= 0 ? '+' : '') + fmtDec(userKPIs.vsOrg, 2) + ' vs org avg' : ''}
                    </div>
                  </div>
                )}
              </div>
              <div className="supporting-kpis">
                <div className="sup-card">
                  <div className="sup-label">All Active Users / Day</div>
                  <div className="sup-value">{fmtDec(orgHrsPerDay, 1)}<span style={{ fontSize: '0.7em', opacity: 0.6 }}> hrs</span></div>
                  <div className="sup-sub">sum across {fmt(avgActiveDevs)} active devs</div>
                </div>
                <div className="sup-card">
                  <div className="sup-label">Economic Value / Day</div>
                  <div className="sup-value" style={{ color: '#3fb950' }}>{fmtCurrency(laborCostPerDay)}</div>
                  <div className="sup-sub">{config.cfg_labor_cost_per_hour != null ? '$' + config.cfg_labor_cost_per_hour + '/hr' : 'set in config'}</div>
                </div>
                <div className="sup-card">
                  <div className="sup-label">Economic Value ({n} days)</div>
                  <div className="sup-value" style={{ color: '#3fb950' }}>{fmtCurrency(laborCost)}</div>
                  <div className="sup-sub">{config.cfg_labor_cost_per_hour != null ? '$' + config.cfg_labor_cost_per_hour + '/hr' : 'set in config'}</div>
                  {userKPIs && userKPIs.econValue != null && (
                    <div className="user-inline">
                      <div className="ui-val">{fmtCurrency(userKPIs.econValue)}</div>
                      <div className="ui-label">{selectedUser}</div>
                    </div>
                  )}
                </div>
              </div>
            </div>
            <div className="Box p-3 mb-3"><Chart options={perDevOpts} /></div>
            <div className="Box p-3"><Chart options={enterpriseOpts} /></div>
          </div>

          <div className="section">
            <div className="d-flex flex-items-center flex-justify-between mb-1">
              <div>
                <div className="section-head">Trend of agentic usage over the period ({n} days)</div>
                <div className="section-desc">Daily activity metrics of the average agentic user that make efficiency gains possible</div>
              </div>
              <div className="view-toggle">
                <button className={viewMode === 'combined' ? 'active' : ''} onClick={() => setViewMode('combined')}>Combined</button>
                <button className={viewMode === 'grid' ? 'active' : ''} onClick={() => setViewMode('grid')}>Grid</button>
              </div>
            </div>
            <div className="driver-toggles">
              {DRIVER_SERIES.filter(s => days.some(d => (d[s.key] || 0) > 0)).map(s => (
                <label key={s.key}>
                  <input type="checkbox" checked={toggles[s.key]} onChange={() => setToggles(prev => ({ ...prev, [s.key]: !prev[s.key] }))} />
                  <span style={{ color: s.color }}>●</span> <span style={{ fontSize: '11px' }}>{s.label}</span>
                </label>
              ))}
            </div>
            {viewMode === 'combined' ? (
              <div className="d-flex flex-wrap" style={{ gap: '16px' }}>
                <div className="Box p-3" style={{ flex: '2 1 480px' }}><Chart options={combinedTrendOpts()} /></div>
                <div className="Box p-3" style={{ flex: '1 1 280px' }}><Chart options={driverBarOpts()} /></div>
              </div>
            ) : (
              <div className="drivers-grid">
                {activeDrivers.map(s => <div key={s.key} className="Box p-2"><Chart options={driverChartOpts(s)} className="chart-sm" /></div>)}
              </div>
            )}
          </div>

          <div className="Box p-4 mt-2">
            <h3 className="f4 mb-3">Data Quality</h3>

            <h4 className="f6 color-fg-accent mb-2">Method Comparison</h4>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '20px' }}>
              <thead>
                <tr>
                  <th className="f6 color-fg-muted py-1" style={{ textAlign: 'left', fontWeight: 500 }}>Method</th>
                  <th className="f6 color-fg-muted py-1" style={{ textAlign: 'right', fontWeight: 500 }}>Avg Hrs/Dev/Day</th>
                  <th className="f6 color-fg-muted py-1" style={{ textAlign: 'right', fontWeight: 500 }}>Total Hrs ({n}d)</th>
                </tr>
              </thead>
              <tbody>
                {dqComparison.map(m => (
                  <tr key={m.key} style={m.active ? { borderLeft: '3px solid #58a6ff', background: 'rgba(88,166,255,0.06)' } : {}}>
                    <td className="py-2" style={{ paddingLeft: m.active ? '9px' : '12px', fontSize: '14px' }}>
                      {m.active && <span style={{ color: '#58a6ff', marginRight: '6px' }}>●</span>}
                      <strong>{m.label}</strong>
                    </td>
                    <td className="py-2" style={{ textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{fmtDec(m.avg, 2)}</td>
                    <td className="py-2" style={{ textAlign: 'right', fontSize: '14px' }}>{fmt(Math.round(m.total))}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h4 className="f6 color-fg-accent mb-2">Coverage</h4>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '20px' }}>
              <tbody>
                <tr><td className="f5 color-fg-muted py-1">Days Loaded</td><td className="f5 py-1" style={{ textAlign: 'right', fontWeight: 600 }}>{effProfile.record_count || n}</td></tr>
                <tr><td className="f5 color-fg-muted py-1">Active Developers</td><td className="f5 py-1" style={{ textAlign: 'right', fontWeight: 600 }}>{fmt(effProfile.unique_people || new Set(users.map(u => u.developer)).size)}</td></tr>
                <tr><td className="f5 color-fg-muted py-1">Developer Days</td><td className="f5 py-1" style={{ textAlign: 'right', fontWeight: 600 }}>{fmt(effProfile.detail_row_count || users.length)}</td></tr>
                <tr><td className="f5 color-fg-muted py-1">PR Sessions</td><td className="f5 py-1" style={{ textAlign: 'right', fontWeight: 600 }}>{fmt(attempts)}</td></tr>
              </tbody>
            </table>

            <h4 className="f6 color-fg-accent mb-2">PR Session Outcomes</h4>
            <div className="d-flex flex-wrap mb-2" style={{ gap: '12px' }}>
              <div className="Box p-3 text-center" style={{ flex: '1 1 80px' }}>
                <div style={{ fontSize: '28px', fontWeight: 700, color: '#3fb950' }}>{fmt(completions)}</div>
                <div className="f6 color-fg-muted">Merged</div>
              </div>
              <div className="Box p-3 text-center" style={{ flex: '1 1 80px' }}>
                <div style={{ fontSize: '28px', fontWeight: 700, color: '#d29922' }}>{fmt(openSessions)}</div>
                <div className="f6 color-fg-muted">Open</div>
              </div>
              <div className="Box p-3 text-center" style={{ flex: '1 1 80px' }}>
                <div style={{ fontSize: '28px', fontWeight: 700, color: '#f85149' }}>{fmt(closedNoMerge)}</div>
                <div className="f6 color-fg-muted">Closed No Merge</div>
              </div>
              <div className="Box p-3 text-center" style={{ flex: '1 1 80px' }}>
                <div style={{ fontSize: '28px', fontWeight: 700, color: 'var(--fgColor-muted)' }}>{fmt(otherSessions)}</div>
                <div className="f6 color-fg-muted">Other</div>
              </div>
            </div>

            <div className="d-flex flex-items-center flex-justify-between mt-3 pt-2" style={{ borderTop: '1px solid var(--borderColor-muted)' }}>
              <span className="f6 color-fg-muted">Sources: <strong>{loadedArtifacts}</strong></span>
              <a href="../../data-status/" className="f6 color-fg-muted" style={{ textDecoration: 'underline' }}>Pipeline Status →</a>
            </div>
          </div>
        </div>

        <SidePanel
          config={config}
          setConfig={(next) => {
            const resolved = typeof next === 'function' ? next(config) : next;
            setConfig(resolved);
            setLoaded(prev => ({ ...prev, days: computeAll(prev.baseDays, resolved) }));
          }}
          method={method}
          setMethod={(nextMethod) => {
            setMethod(nextMethod);
            setLoaded(prev => ({ ...prev, days: computeAll(prev.baseDays, config) }));
          }}
          days={days}
          users={users}
          selectedUser={selectedUser}
          setSelectedUser={setSelectedUser}
          configSource={configSource}
        />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
